<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF Semantic Search</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e1e4e8;
    --text: #1d2127;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-dim: #dbeafe;
    --danger: #dc2626;
    --highlight: rgba(250, 204, 21, 0.55);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f25;
      --border: #2c3038;
      --text: #e7e9ec;
      --text-dim: #9aa1ab;
      --accent: #5b9bff;
      --accent-dim: #1e3a63;
      --danger: #f87171;
      --highlight: rgba(250, 204, 21, 0.45);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  header span.tag {
    font-size: 11px; color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px;
  }
  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .sidebar {
    width: 340px;
    min-width: 280px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  #docList { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  .doc-item {
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .doc-item:hover { background: var(--accent-dim); }
  .doc-item.active { background: var(--accent); color: #fff; }
  .doc-item .meta { font-size: 11px; color: var(--text-dim); }
  .doc-item.active .meta { color: #e5edff; }
  .doc-item .status-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 999px; display: inline-block;
    background: var(--accent-dim); color: var(--accent); width: fit-content;
  }

  .upload-box {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .upload-box:hover { border-color: var(--accent); background: var(--accent-dim); }
  .upload-box input { display: none; }

  .search-section { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 14px 16px; }
  .search-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .search-row input {
    flex: 1; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  .search-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search-row button, .btn {
    padding: 9px 14px; border-radius: 8px; border: none; background: var(--accent);
    color: #fff; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .search-row button:disabled, .btn:disabled { opacity: .5; cursor: default; }

  #resultList { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .result-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .result-item:hover { border-color: var(--accent); }
  .result-item.active { border-color: var(--accent); background: var(--accent-dim); }
  .result-item .result-head {
    display: flex; justify-content: space-between; margin-bottom: 4px;
    font-size: 11px; color: var(--text-dim);
  }
  .result-item .sim { color: var(--accent); font-weight: 700; }
  .result-item .snippet { color: var(--text); }

  .empty-hint { color: var(--text-dim); font-size: 12.5px; padding: 6px 2px; }

  .viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .viewer-toolbar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .viewer-toolbar button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px;
  }
  .viewer-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  .viewer-stage {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
    background: var(--bg);
  }
  .page-wrap {
    position: relative;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
    background: #fff;
  }
  .page-wrap canvas { display: block; }

  /* pdf.js text layer: glyphs transparent, overlays canvas exactly, selectable text */
  .textLayer {
    position: absolute;
    left: 0; top: 0;
    overflow: hidden;
    opacity: 1;
    line-height: 1;
  }
  .textLayer span {
    color: transparent;
    position: absolute;
    white-space: pre;
    cursor: text;
    transform-origin: 0% 0%;
  }
  .textLayer span.hl {
    background: var(--highlight);
    border-radius: 2px;
  }

  .placeholder {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    max-width: 320px;
  }
</style>
</head>
<body>

<header>
  <h1>PDF Semantic Search</h1>
  <span class="tag">anlamsal Ctrl+F</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <h2>PDF Yükle</h2>
      <label class="upload-box" id="uploadBox">
        <span id="uploadLabel">Tıkla veya sürükle bırak (.pdf)</span>
        <input type="file" id="fileInput" accept="application/pdf" />
      </label>
    </div>
    <div class="sidebar-section" style="flex: 0 0 auto; max-height: 220px; display:flex; flex-direction:column;">
      <h2>Dokümanlar</h2>
      <ul id="docList"></ul>
    </div>
    <div class="search-section">
      <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:0 0 10px;">Ara</h2>
      <div class="search-row">
        <input id="queryInput" type="text" placeholder="Ne arıyorsun? (örn. motor bakım periyodu)" disabled />
        <button id="searchBtn" disabled>Ara</button>
      </div>
      <ul id="resultList"></ul>
    </div>
  </aside>

  <main class="viewer">
    <div class="viewer-toolbar">
      <button id="prevPage">&larr;</button>
      <span id="pageIndicator">-</span>
      <button id="nextPage">&rarr;</button>
      <span style="flex:1"></span>
      <span id="statusText" style="color:var(--text-dim)"></span>
    </div>
    <div class="viewer-stage" id="viewerStage">
      <div class="placeholder" id="placeholder">
        Bir PDF yükle veya listeden seç, sonra ne aradığını yaz.<br/>
        Eşleşen bölüm otomatik olarak sayfada vurgulanır.
      </div>
    </div>
  </main>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const state = {
  documents: [],
  currentDocId: null,
  pdfDoc: null,       // pdf.js document proxy
  currentPage: 1,
  totalPages: 0,
  results: [],
  activeResultIndex: -1,
  pendingHighlightText: null,
};

const el = {
  fileInput: document.getElementById("fileInput"),
  uploadBox: document.getElementById("uploadBox"),
  uploadLabel: document.getElementById("uploadLabel"),
  docList: document.getElementById("docList"),
  queryInput: document.getElementById("queryInput"),
  searchBtn: document.getElementById("searchBtn"),
  resultList: document.getElementById("resultList"),
  prevPage: document.getElementById("prevPage"),
  nextPage: document.getElementById("nextPage"),
  pageIndicator: document.getElementById("pageIndicator"),
  statusText: document.getElementById("statusText"),
  viewerStage: document.getElementById("viewerStage"),
  placeholder: document.getElementById("placeholder"),
};

// ── Yardımcılar ──────────────────────────────────────────────────────────

function normalize(s) {
  return s.toLowerCase().replace(/\s+/g, " ").trim();
}

function setStatus(msg) {
  el.statusText.textContent = msg || "";
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

// ── Doküman listesi ──────────────────────────────────────────────────────

async function loadDocuments() {
  state.documents = await api("/api/documents/");
  renderDocList();
}

function renderDocList() {
  el.docList.innerHTML = "";
  if (state.documents.length === 0) {
    const li = document.createElement("li");
    li.className = "empty-hint";
    li.textContent = "Henüz doküman yok.";
    el.docList.appendChild(li);
    return;
  }
  for (const doc of state.documents) {
    const li = document.createElement("li");
    li.className = "doc-item" + (doc.id === state.currentDocId ? " active" : "");
    li.innerHTML = `
      <span>${escapeHtml(doc.title)}</span>
      <span class="meta">${doc.total_pages || "?"} sayfa · ${doc.file_size_kb} KB</span>
      <span class="status-badge">${doc.status}</span>
    `;
    li.addEventListener("click", () => selectDocument(doc.id));
    el.docList.appendChild(li);
  }
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// ── Yükleme ──────────────────────────────────────────────────────────────

el.uploadBox.addEventListener("dragover", (e) => { e.preventDefault(); el.uploadBox.style.borderColor = "var(--accent)"; });
el.uploadBox.addEventListener("dragleave", () => { el.uploadBox.style.borderColor = ""; });
el.uploadBox.addEventListener("drop", (e) => {
  e.preventDefault();
  el.uploadBox.style.borderColor = "";
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
el.fileInput.addEventListener("change", (e) => {
  if (e.target.files.length) uploadFile(e.target.files[0]);
});

async function uploadFile(file) {
  if (!file.name.toLowerCase().endsWith(".pdf")) {
    alert("Sadece PDF dosyası yüklenebilir.");
    return;
  }
  el.uploadLabel.textContent = "Yükleniyor ve indeksleniyor...";
  const formData = new FormData();
  formData.append("file", file);
  try {
    const doc = await api("/api/documents/upload", { method: "POST", body: formData });
    el.uploadLabel.textContent = "Tıkla veya sürükle bırak (.pdf)";
    el.fileInput.value = "";
    await loadDocuments();
    await selectDocument(doc.id);
  } catch (err) {
    el.uploadLabel.textContent = "Tıkla veya sürükle bırak (.pdf)";
    alert("Yükleme hatası: " + err.message);
  }
}

// ── Doküman seçme & PDF render ───────────────────────────────────────────

async function selectDocument(id) {
  state.currentDocId = id;
  state.results = [];
  state.activeResultIndex = -1;
  renderResultList();
  renderDocList();
  el.placeholder.style.display = "none";

  setStatus("PDF yükleniyor...");
  const loadingTask = pdfjsLib.getDocument(`/api/documents/${id}/file`);
  state.pdfDoc = await loadingTask.promise;
  state.totalPages = state.pdfDoc.numPages;
  state.currentPage = 1;
  await renderPage(1);

  el.queryInput.disabled = false;
  el.searchBtn.disabled = false;
  setStatus("");
}

async function renderPage(pageNum) {
  if (!state.pdfDoc) return;
  state.currentPage = Math.max(1, Math.min(pageNum, state.totalPages));
  el.pageIndicator.textContent = `Sayfa ${state.currentPage} / ${state.totalPages}`;

  const page = await state.pdfDoc.getPage(state.currentPage);
  const nativeViewport = page.getViewport({ scale: 1 });
  const containerWidth = el.viewerStage.clientWidth - 48;
  const scale = Math.min(1.8, Math.max(0.6, containerWidth / nativeViewport.width));
  const viewport = page.getViewport({ scale });

  el.viewerStage.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "page-wrap";
  wrap.style.width = viewport.width + "px";
  wrap.style.height = viewport.height + "px";

  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  wrap.appendChild(canvas);

  const textLayerDiv = document.createElement("div");
  textLayerDiv.className = "textLayer";
  textLayerDiv.style.width = viewport.width + "px";
  textLayerDiv.style.height = viewport.height + "px";
  wrap.appendChild(textLayerDiv);

  el.viewerStage.appendChild(wrap);

  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;

  const textContent = await page.getTextContent();
  const textDivs = [];
  const textLayerTask = pdfjsLib.renderTextLayer({
    textContentSource: textContent,
    container: textLayerDiv,
    viewport,
    textDivs,
  });
  await textLayerTask.promise;

  if (state.pendingHighlightText) {
    highlightInTextLayer(textDivs, state.pendingHighlightText);
    state.pendingHighlightText = null;
  }
}

el.prevPage.addEventListener("click", () => renderPage(state.currentPage - 1));
el.nextPage.addEventListener("click", () => renderPage(state.currentPage + 1));

// ── Vurgulama: donen chunk metnini sayfanin text layer'inda bulur ────────

function highlightInTextLayer(textDivs, targetText) {
  if (!targetText || textDivs.length === 0) return;

  let concatenated = "";
  const ranges = []; // {start, end, span}
  for (const span of textDivs) {
    const t = span.textContent || "";
    const start = concatenated.length;
    concatenated += t + " ";
    ranges.push({ start, end: start + t.length, span });
  }
  const normPage = normalize(concatenated);
  const normTarget = normalize(targetText);

  let needle = normTarget.slice(0, 90).trim();
  let idx = normPage.indexOf(needle);
  if (idx === -1) {
    needle = normTarget.slice(0, 40).trim();
    idx = normPage.indexOf(needle);
  }
  if (idx === -1) return;

  const start = idx;
  const end = idx + needle.length;

  // normalize() collapses whitespace runs to single chars, so raw/normalized
  // offsets drift slightly on multi-space input; a small tolerance window
  // keeps the overlap check correct without re-deriving an exact char map.
  const slack = 30;
  for (const r of ranges) {
    if (r.end + slack > start && r.start - slack < end) {
      r.span.classList.add("hl");
    }
  }
  const first = textDivs.find((s) => s.classList.contains("hl"));
  if (first) first.scrollIntoView({ block: "center", inline: "nearest" });
}

// ── Arama ────────────────────────────────────────────────────────────────

el.searchBtn.addEventListener("click", runSearch);
el.queryInput.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

async function runSearch() {
  const query = el.queryInput.value.trim();
  if (!query || !state.currentDocId) return;

  el.searchBtn.disabled = true;
  setStatus("Aranıyor...");
  try {
    state.results = await api(`/api/documents/${state.currentDocId}/search`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, top_k: 8 }),
    });
    state.activeResultIndex = -1;
    renderResultList();
    if (state.results.length > 0) {
      await goToResult(0);
    } else {
      setStatus("Sonuç bulunamadı.");
    }
  } catch (err) {
    alert("Arama hatası: " + err.message);
  } finally {
    el.searchBtn.disabled = false;
    if (state.results.length > 0) setStatus("");
  }
}

function renderResultList() {
  el.resultList.innerHTML = "";
  if (state.results.length === 0) {
    const li = document.createElement("li");
    li.className = "empty-hint";
    li.textContent = "Henüz arama yapılmadı.";
    el.resultList.appendChild(li);
    return;
  }
  state.results.forEach((r, i) => {
    const li = document.createElement("li");
    li.className = "result-item" + (i === state.activeResultIndex ? " active" : "");
    li.innerHTML = `
      <div class="result-head">
        <span>Sayfa ${r.page}</span>
        <span class="sim">%${Math.round(r.similarity * 100)}</span>
      </div>
      <div class="snippet">${escapeHtml(r.text.slice(0, 220))}${r.text.length > 220 ? "…" : ""}</div>
    `;
    li.addEventListener("click", () => goToResult(i));
    el.resultList.appendChild(li);
  });
}

async function goToResult(index) {
  state.activeResultIndex = index;
  renderResultList();
  const result = state.results[index];
  state.pendingHighlightText = result.text;
  await renderPage(result.page);
}

// ── Başlangıç ────────────────────────────────────────────────────────────

loadDocuments().catch((err) => setStatus("Doküman listesi alınamadı: " + err.message));
</script>
</body>
</html>
